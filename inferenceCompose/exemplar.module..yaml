module:
  name: exemplar
  template_vars:
    provider_name: "`self.inference_client_config.provider.provider_name`"
    model_short_name: "`self.inference_client_config.model.model_short_name`"
    model_tag: "{provider_name}_{model_short_name}"
  input:
    # reference task
    - type: duckdb
      name: reference
      template_vars:
        prefix_tag: "`input.prefix_tag`"
        epoch_id: "`input.epoch_id`"
        block_id: "`input.block_id`"
        input_tag: "`input.input_tag`"
      query: |
        SELECT * FROM {input_tag}
      enqueue:
        item:
          type: "reference"
          run_tag: "`input.input_tag`" # run_tag is the input tag
          task_id: "`row.task_id`" # task_id is the unique task id
          reference_code: "`row.reference_code`" # reference code
    # generate code and evaluate
    - type: duckdb
      name: generate
      template_vars:
        prefix_tag: "`input.prefix_tag`"
        epoch_id: "`input.epoch_id`"
        block_id: "`input.block_id`"
        input_tag: "`input.input_tag`"
      query: |
        SELECT * FROM {input_tag}
      enqueue:
        repeat: "`input.num_generations`"
        item:
          type: "generate"
          run_tag: "`input.input_tag`" # run_tag is the input tag
          task_id: "`row.task_id`" # task_id is the unique task id
          reference_code: "`row.reference_code`" # reference code
          generated_code: "`row.generated_code`" # generated code
          num_turns: "`input.num_turns_per_generation`" # number of turns per generation

  processor:
    reference:
      filter: "`True`"
      tasks:
        - type: kb_eval_ref
          input:
            run_tag: "`input.run_tag`"
            model_tag: "`module.model_tag`"
            task_tag: "`input.task_tag`" # task_tag is the task name
            reference_code: "`input.reference_code`"
          returns: reference_eval
    generate:
      - type: inference.completion
        

    - type: eval.reference
      input_tag: "{input_tag}"
      provider_name: "{provider_name}"
      model_name: "{model_name}"
      task_id: "{task_id}"
      reference_code: "{reference_code}"
      returns: reference_eval
    - type: eval.custom.triton
      input_tag: "{input_tag}"
      provider_name: "{provider_name}"
      model_name: "{model_name}"
      task_id: "{task_id}"
      reference_code: "{reference_code}"
      generated_code: "{generated_code}"
      returns: generated_eval
    - type: generate.triton
      input_tag: "{input_tag}"
      provider_name: "{provider_name}"
      task_id: "{task_id}"
