# Base Model, full precision
model_paths:
  base_model: "Qwen/Qwen3-32B"
  lora_adapter: ""
  output_model_path: "finetune_model_output/qwen3_32b_awq_alpaca_repeat/" # path to the output model

data_paths:
  calibration_experience: "finetune_raw_experiences/" # "alpaca"  # path to the calibration experience
  eval_experience: "finetune_raw_experiences/"  # path to the evaluation experience

device_map: auto

quantize_params:
  apply_quantization: False
  n_parallel_calib_samples: 32
  max_calib_samples: 128
  max_calib_seq_len: 2048
