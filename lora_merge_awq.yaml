# Base Model, full precision
model_paths:
  base_model: "Qwen/Qwen3-32B"
  lora_adapter: "finetune_model_output/sft_t3/checkpoint-181/"
  output_model_path: "finetune_model_output/sft_t3/qwen3_32b_awq/" # path to the output model
  output_model_fullprec_path: "finetune_model_output/sft_t3/qwen3_32b/" # path to the output model

data_paths:
  calibration_experience: "alpaca" # "alpaca"  # path to the calibration experience
  eval_experience: "finetune_raw_experiences/"  # path to the evaluation experience

device_map: cuda:4

quantize_params:
  apply_quantization: true
  n_parallel_calib_samples: 32
  max_calib_samples: 128
  max_calib_seq_len: 2048
