module:
  name: grpo
  # built-in context like `self` has already been set
  # here we add addotional context variables for easier access by the program
  # variables will be evaluated sequentially, so that later variables can use earlier variables

  # input processor
  input_processor:
    # prepare the input data for grpo training
    steps:
      - type: endpoint
        endpoint: duckdbClient.sql
        context_vars:
          input_dir: '`block.input_dir`'
          input_tag: '`block.input_tag`'
        args:
          query: |
            WITH refs AS(
                SELECT
                    regexp_replace(filename, '/[^/]*$', '') AS task_id,
                    runtime_stats
                FROM read_json_auto('{input_dir}/{input_tag}/**/reference_eval.json', filename = true)
            ),
            evals AS (
                SELECT
                    filename AS eval_file,
                    regexp_replace(filename, '_generated_eval\.json$', '') AS stem,
                    regexp_replace(filename, '/[^/]*$', '') AS task_id,
                    compiled, correctness, runtime, reference_runtime as ref_runtime, runtime_stats
                FROM read_json_auto('{input_dir}/{input_tag}/**/*_generated_eval.json', filename = true)
            ),
            evals_join AS (
                SELECT e.*, r.runtime_stats as ref_runtime_stats
                FROM evals e
                LEFT JOIN refs r USING (task_id)
            ),
            comps AS (
                SELECT
                    filename AS completion_file,
                    regexp_replace(filename, '_completion\.json$', '') AS stem,
                    prompt, completion, logprobs, metadata,
                    metadata->>'task_tag' AS task_tag, metadata->>'gen_tag' AS gen_tag, metadata->>'turn_tag' AS turn_tag
                FROM read_json_auto('{input_dir}/{input_tag}/**/*_completion.json', filename = true)
            ),
            logps AS (
                SELECT
                    filename AS logps_file,
                    regexp_replace(filename, '_logps\.json$', '') AS stem,
                    prompt_ids, completion_ids, input_ids, logps
                FROM read_json_auto('{input_dir}/{input_tag}/**/*_logps.json', filename = true)
            )
            SELECT
                e.compiled, e.correctness, e.runtime, e.ref_runtime, e.runtime_stats, e.ref_runtime_stats,
                c.prompt, c.completion, c.logprobs, c.metadata,
                e.eval_file, c.completion_file,
                l.prompt_ids, l.completion_ids, l.input_ids, l.logps,
                c.task_tag, c.gen_tag, c.turn_tag
            FROM evals_join e
            JOIN comps c USING (stem)
            JOIN logps l USING (stem)
            ORDER BY task_tag, gen_tag, turn_tag
        returns:
          error_if: '`__result__ is None`'
          context_vars:
            query_result: '`__result__.df().to_dict(orient="records")`'
          logging:
            method: 'log_raw_data'
      # compute rewards and advantages
      - type: code
        context_vars:
          tokenizer: '`__runtime__.tokenizer`'
        code_snippet_path: 'trainer/grpo.reward.kb.py'
        code_snippet_block: |
          # compute rewards and advantages
          groups = grpo_compute_rewards_v4(
              query_result,
              gamma=grpo_config.gamma,
          )
          groups = grpo_compute_advantages(
              groups,
              reward_scale=grpo_config.reward_scale,
              reward_epsilon=grpo_config.reward_epsilon,
              reward_noise=grpo_config.reward_noise,
          )
          # create group datasets
          group_datasets = {key: grpo_group_to_dataset(value, tokenizer) for key, value in groups.items()}
          __result__ = group_datasets
          # TODO: save the groups to the .trainer directory
        returns:
          error_if: '`__result__ is None`'
