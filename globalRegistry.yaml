# fastapi server
fastapi:
  host: 0.0.0.0
  port: 8084
  dequeue_timeout: 5

client:
  host: 10.12.0.201
  port: 8084
  retries: 5
  timeout: 300

# built in queues
queues:
  - name: trainer.sft
  - name: trainer.rft
  - name: trainer.grpo
  - name: inference.codeGenEval
  - name: inference.exemplar
  - name: inference.critique
  - name: test

# built-in tasks
_refresh_config_task:
  interval: 15

_save_queue_task:
  interval: 15

_save_adapter_task:
  interval: 15