# fastapi server
fastapi:
  host: 0.0.0.0
  port: 0
  dequeue_timeout: 5

client:
  host: localhost
  port: 8084
  retries: 5
  timeout: 300

# built in queues
queues:
  - name: trainer.sft:sft.1
  - name: trainer.rft:rft.1
  - name: trainer.grpo:grpo.1
  - name: test:test.1

# built-in tasks
_refresh_config_task:
  interval: 15

_save_queue_task:
  interval: 15

_save_adapter_task:
  interval: 15