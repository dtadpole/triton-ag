model:
  name: "gpt2"
  engine: "fsdp"
  max_seq_length: 512
  use_gradient_checkpointing: true
  load_in_4bit: false
  load_in_8bit: false
  full_finetuning: false
  compute_dtype: "bfloat16"
  trust_remote_code: true

training:
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.000005
  block_size: 2
  max_steps: 10
  save_steps: 5
  eval_steps: 5
  retain_steps: 1000
  logging_steps: 1
  checkpoint_path: "./test_checkpoints"
  latest_checkpoint_name: "checkpoint-latest"
  max_grad_norm: 0.1
  scheduler_type: "cosine"
  num_warmup_steps: 2
  dataloader_num_workers: 0
  loss_multiplier: 1.0
  keep_checkpoint_num: 2
  seed: 42

optimizer:
  optimizer_type: "AdamW"
  betas: [0.9, 0.99]
  eps: 1e-8
  weight_decay: 0.01
  momentum: 0.9
  nesterov: false

lora:
  use_lora: false
  rank: 64
  alpha: 32
  dropout: 0.0
  target_modules: null
  target_parameters: null
  modules_to_save: null
  bias: "none"

logging:
  use_wandb: false
  wandb_project: "test_fsdp"
  wandb_run_name: null
  wandb_run_id: null
