# ============================================================================
# TrainerSFT Configuration File
# ============================================================================
# Simplified configuration for Unsloth-based training with SFT

sft:
  max_seq_length: 10240
  mask_non_assistant_tokens: true
  discard_long_conversations: true # false will truncate the conversation to the max_seq_length

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
training:
  # Basic training parameters
  micro_batch_size: 2
  loss_multiplier: 0.5
