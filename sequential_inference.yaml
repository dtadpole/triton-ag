# Sequential Inference Configuration
# Basic settings for SGLang streaming client

sglang:
  common:
    # Server connection settings
    base_url: "http://10.12.0.204:8081/v1"
    api_key: "${HOME}/.keys/local.api.key"
    timeout: null
    max_retries: 0
    
  generation:
    # Default streaming generation parameters
    model: "default"
    temperature: 0.7
    max_tokens: 1024
    logprobs: 5  # Number of log probabilities to capture for each token
    
  prompts:
    # System and user prompts
    system_prompt: "You are a helpful assistant."
    
    # User prompt template with substitutable source code parameter
    user_prompt: "Analyze and explain the following source code:\n\n```\n{source_code}\n```\n\nProvide a detailed explanation of what this code does, how it works, and any potential improvements. Be concise and to the point."
    
    # Example source code for testing
    example_source_code: |
      def factorial(n):
          if n <= 1:
              return 1
          else:
              return n * factorial(n - 1) 