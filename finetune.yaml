# Simplified Qwen Fine-tuning Configuration

# Model Configuration
model:
  name: "Qwen/Qwen3-4B"
  max_seq_length: 40960
  dtype: null  # Auto-detection
  load_in_4bit: true

# Training Configuration
training:
  # Core training parameters
  num_train_epochs: 1
  learning_rate: 0.00003 # 3e-5
  max_steps: -1  # Set to -1 for full epochs
  warmup_steps: 5
  
  # Batch settings
  per_device_batch_size: 1
  gradient_accumulation_steps: 4
  
  # Optimization
  optim: "paged_adamw_8bit"
  weight_decay: 0.05
  lr_scheduler_type: "cosine"
  max_grad_norm: 0.5  # Gradient clipping
  
  # Logging and saving
  logging_steps: 1
  save_steps: 10
  save_total_limit: 3
  output_dir: "../qwen3-unsloth-finetuned"
  
  # System settings
  seed: 3407
  use_custom_loss_masking: true

# LoRA Configuration
lora:
  r: 32
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "down_proj"
    - "up_proj"
  bias: "none"

# Data Configuration  
data:
  local_dir: "finetune_experiences"

# GPU Configuration
gpu:
  single_gpu: false  # Enable multi-GPU for data parallel training
  data_parallel: true  # Use data parallel training
