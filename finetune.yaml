# Qwen Fine-tuning Configuration
# Clean, structured configuration for Unsloth-based fine-tuning

# Model Configuration
model:
  name: "unsloth/Qwen3-32B-bnb-4bit"
  # name: "unsloth/Qwen3-8B"
  # name: "Qwen/Qwen3-8B"
  # name: "Qwen/Qwen3-8B-AWQ"
  # name: "Qwen/Qwen2.5-0.5B-Instruct"
  # name: "Qwen/Qwen3-0.6B"
  max_seq_length: 40960
  dtype: null  # Auto-detection
  load_in_4bit: true

# Training Configuration
training:
  # Core training parameters
  learning_rate: 3e-5
  max_steps: -1  # Set to -1 for full epochs
  warmup_steps: 5
  
  # Batch and memory settings
  per_device_batch_size: 2
  gradient_accumulation_steps: 4
  
  # Optimization
  optim: "adamw_8bit"
  weight_decay: 0.01
  lr_scheduler_type: "linear"
  
  # Logging and saving
  logging_steps: 1
  save_steps: 25
  save_total_limit: 2
  output_dir: "./qwen3-unsloth-finetuned"
  
  # Multi-GPU and system settings
  dataloader_num_workers: 4
  seed: 3407
  dataloader_pin_memory: false
  ddp_find_unused_parameters: false
  remove_unused_columns: false
  
  # Dataset processing
  dataset_num_proc: 2
  packing: false

# LoRA Configuration
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "down_proj"
    - "up_proj"
  # Advanced LoRA settings
  bias: "none"
  use_gradient_checkpointing: "unsloth"
  random_state: 3407
  use_rslora: false
  loftq_config: null

# Data Configuration  
data:
  local_dir: "finetune_experiences"
  # S3 data sources (if needed)
  s3_folders:
    - s3://agent-xyz/kernel_coder/anthropic
    - s3://agent-xyz/kernel_coder/deepseek
    - s3://agent-xyz/kernel_coder/fireworks/deepseek-v3
    - s3://agent-xyz/kernel_coder/gemini/gemini-2.5-pro
    - s3://agent-xyz/kernel_bench/level1
    - s3://agent-xyz/kernel_bench/level2
