deepseek:
  common:
    api_key: ${HOME}/.keys/deepseek.api.key
    base_url: https://api.deepseek.com/v1
  models:
    deepseek-chat:
      settings:
        max_tokens: 8192
        temperature: 0.6
    deepseek-reasoner:
      settings:
        max_tokens: 20480
        temperature: 0.6

fireworks:
  common:
    dspy_provider: openai
    api_key: ${HOME}/.keys/fireworks.api.key
    base_url: https://api.fireworks.ai/inference/v1
  models:
    deepseek-r1:
      name: accounts/fireworks/models/deepseek-r1-0528
      settings:
        max_tokens: 40960
        temperature: 0.6
    deepseek-v3:
      name: accounts/fireworks/models/deepseek-v3-0324
      settings:
        max_tokens: 40960
        temperature: 0.6
    qwq-32b:
      name: accounts/fireworks/models/qwq-32b
      settings:
        max_tokens: 81920
        temperature: 0.6
    qwen-3-235b:
      name: accounts/fireworks/models/qwen3-235b-a22b
      settings:
        max_tokens: 81920
        temperature: 0.6

anthropic:
  common:
    dspy_provider: anthropic
    api_key: ${HOME}/.keys/anthropic.api.key
    base_url: https://api.anthropic.com/v1
  models:
    claude-3.7-sonnet:
      name: claude-3-7-sonnet-latest
      settings:
        temperature: 0.6
        max_tokens: 20480
    claude-3.7-sonnet-thinking:
      name: claude-3-7-sonnet-latest
      settings:
        temperature: 0.6
        max_tokens: 20480
        thinking:
          type: enabled
          budget_tokens: 16384
    claude-4-sonnet:
      name: claude-sonnet-4-20250514
