deepseek:
  common:
    api_key: ${HOME}/.keys/deepseek.api.key
    base_url: https://api.deepseek.com/v1
  models:
    deepseek-chat:
      settings:
        max_tokens: 8192
        temperature: 0.6
    deepseek-reasoner:
      settings:
        max_tokens: 20480
        temperature: 0.6

anthropic:
  common:
    provider: anthropic
    api_key: ${HOME}/.keys/anthropic.api.key
    base_url: https://api.anthropic.com/v1
  models:
    claude-3.7-sonnet:
      name: claude-3-7-sonnet-latest
      settings:
        temperature: 0.6
        max_tokens: 20480
    claude-3.7-sonnet-thinking:
      name: claude-3-7-sonnet-latest
      settings:
        temperature: 0.6
        max_tokens: 20480
        thinking:
          type: enabled
          budget_tokens: 16384
    claude-4-sonnet:
      name: claude-sonnet-4-20250514
      settings:
        temperature: 0.6
        max_tokens: 20480
    claude-4-sonnet-thinking:
      name: claude-sonnet-4-20250514
      settings:
        temperature: 0.6
        max_tokens: 20480
        thinking:
          type: enabled
          budget_tokens: 16384
