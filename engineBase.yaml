# ============================================================================
# TrainerBase Configuration File
# ============================================================================
# Simplified configuration for Unsloth-based training with LoRA
# Automatically uses 4-bit quantization for memory efficiency

# ============================================================================
# MODEL CONFIGURATION
# ============================================================================
model:
  name: "Qwen/Qwen3-0.6B"  # Model name from Hugging Face
  # name: "unsloth/gpt-oss-20b"
  # name: "unsloth/gpt-oss-20b-unsloth-bnb-4bit"
  tokenizer_name: null  # If null, uses model name as tokenizer
  max_seq_length: 24576  # Maximum sequence length for training
  engine: "unsloth"  # deepspeed, unsloth, fsdp, etc
  use_gradient_checkpointing: true  # Enable gradient checkpointing to save memory
  load_in_4bit: false  # Enable 4-bit quantization for memory efficiency
  load_in_8bit: false  # Enable 8-bit quantization for memory efficiency
  full_finetuning: false # Enable full finetuning of the model
  # compute_dtype: "bfloat16"  # bfloat16 or float16

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
training:
  # Basic training parameters
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.00001 # changed from 0.000002 (2e-6) to 0.00001 (1e-5)
  max_steps: 500000
  # block_size: 16

  # Checkpointing and evaluation
  save_steps: 100
  eval_steps: 100
  retain_steps: 1000
  logging_steps: 1

  # Output directory
  checkpoint_path: "~/.trainer"
  latest_checkpoint_name: "checkpoint-latest"

  # Optimization settings
  max_grad_norm: 0.1
  scheduler_type: "cosine"
  num_warmup_steps: 500

  # Performance settings
  dataloader_num_workers: 1
  seed: -1

# ============================================================================
# OPTIMIZER CONFIGURATION
# ============================================================================
optimizer:
  optimizer_type: "AdamW"  # AdamW, Adam, SGD
  betas: [0.9, 0.99]  # Beta parameters for Adam/AdamW
  eps: 1e-8  # Epsilon for Adam/AdamW
  weight_decay: 0.01  # Weight decay
  momentum: 0.9  # Momentum for SGD
  nesterov: false  # Nesterov momentum for SGD

# ============================================================================
# LORA CONFIGURATION
# ============================================================================
lora:
  use_lora: false  # Always use LoRA for efficient training
  rank: 128  # LoRA rank (r)
  alpha: 32  # LoRA alpha
  dropout: 0.0  # Use 0.0 for optimal Unsloth performance
  # target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj", "lm_head"]
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  # target_modules: "all-linear"
  # target_parameters:
  #   - "7.mlp.experts.gate_up_proj"
  #   - "7.mlp.experts.down_proj"
  #   - "15.mlp.experts.gate_up_proj"
  #   - "15.mlp.experts.down_proj"
  #   - "23.mlp.experts.gate_up_proj"
  #   - "23.mlp.experts.down_proj"
  bias: "none"  # Options: "none", "all", "lora_only"
  # modules_to_save: ["lm_head"] # ["lm_head", "embed_tokens"]
  rank_pattern :
    r".*q_proj$": 192,
    r".*v_proj$": 192,
    r".*k_proj$": 96,
    r".*o_proj$": 96,
    r".*up_proj$": 192,
    r".*gate_proj$": 96,
    r".*down_proj$": 96,
    r".*lm_head$": 256,   # include only if you're adapting the head

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging:
  use_wandb: true
  wandb_project: kb_trainer
  wandb_run_name: null
  wandb_run_id: null
