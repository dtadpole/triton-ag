# fastapi server
fastapi:
  one:
    host: 0.0.0.0
    port: 41488
  two:
    host: 0.0.0.0
    port: 42488
  four:
    host: 0.0.0.0
    port: 44488
  dequeue_timeout: 5

client:
  host: 127.0.0.1
  port: 8488
  retries: 5
  timeout: 300

registry:
  TC_0.1.0_14B.m:
    short_name: "t14m"
    config_path: "workflow/14B.m.yaml"
    data_dir: "~/.workflow"
  TC_0.1.0_14B.n:
    short_name: "t14n"
    config_path: "workflow/14B.n.yaml"
    data_dir: "~/.workflow"
  TC_0.1.0_32B.a:
    short_name: "t32a"
    config_path: "workflow/32B.a.yaml"
    data_dir: "~/.workflow"
  test:
    short_name: "test"
    config_path: "workflow/test.yaml"
    data_dir: "~/.workflow"

# built-in tasks
_refresh_config_task:
  interval: 15

_refresh_workflow_task:
  interval: 15

_save_queue_task:
  interval: 15

_save_adapter_task:
  interval: 15
