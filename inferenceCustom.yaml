server:
  host: "::"
  port: 8002

model:
  model_name: Qwen/Qwen3-32B
  tokenizer_name: Qwen/Qwen3-32B
  max_seq_len: 24576
  mini_batch_size: 1
  pad_to_multiple_of: 8
  check_interval: 1
  prob_timeout: 120
  _attn_implementation: sdpa
  model_path: shared/.trainer
  default_lora_config:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bias: "none"
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

