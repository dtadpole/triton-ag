server:
  host: "::"
  port: 8092

model:
  model_name: Qwen/Qwen3-32B
  tokenizer_name: Qwen/Qwen3-32B
  max_seq_len: 24576
  mini_batch_size: 4
  pad_to_multiple_of: 8
  check_interval: 1
  prob_timeout: 120
  _attn_implementation: sdpa
  model_path: ~/.trainer
  default_lora_config:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    bias: "none"
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

providers:
  local:
    base_url: "http://localhost:8092/v1"
    api_key_path: "~/.keys/local.api.key"

  h1:
    base_url: "http://devvm2461.eag0.facebook.com:8092/v1"
    api_key_path: "~/.keys/local.api.key"

  h2:
    base_url: "http://devvm28305.prn0.facebook.com:8092/v1"
    api_key_path: "~/.keys/local.api.key"

  h8_1:
    base_url: "http://devvm3317.eag0.facebook.com:8092/v1"
    api_key_path: "~/.keys/local.api.key"

  h8_2:
    base_url: "http://devgpu016.prn6.facebook.com:8092/v1"
    api_key_path: "~/.keys/local.api.key"
