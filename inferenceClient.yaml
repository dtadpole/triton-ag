# Inference Client Configuration

local:
  common:
    api_key_path: "${HOME}/.keys/local.api.key"
    base_url: "http://localhost:8091/v1"
    streaming: true

  models:
    qwen3-14b:
      model_name: "Qwen/Qwen3-14B"
      # model_name: "KC_0.1.0_14B/checkpoint-60"
