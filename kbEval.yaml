kbEvalCli:
  one:
    env_vars:
      MAX_JOBS: 6
      TORCH_CUDA_ARCH_LIST: "8.9"
      CUDAARCHS: "89"
      NVCC_APPEND_FLAGS: "--threads=4"
      TMPDIR: "/dev/shm/nvcc_tmp"
      # CC: "sccache gcc"
      # CXX: "sccache g++"
      # CUDA_WRAPPER: "sccache"
