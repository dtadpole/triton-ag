upstream backend {
    least_conn;
    server localhost:8001 max_fails=3 fail_timeout=10000s;
    server localhost:8002 max_fails=3 fail_timeout=10000s;
    server localhost:8003 max_fails=3 fail_timeout=10000s;
    # server localhost:8004 max_fails=3 fail_timeout=10000s;
}

server {
    listen 8089;
    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
