# ============================================================================
# TrainerRFT Configuration File
# ============================================================================
# Simplified configuration for Unsloth-based training with RFT

rft:
  max_seq_length: 24576
  mask_non_assistant_tokens: true
  mask_non_last_assistant_tokens: true
  discard_long_conversations: true # false will truncate the conversation to the max_seq_length

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
training:
  # Basic training parameters
  micro_batch_size: 4
  loss_multiplier: 0.5
