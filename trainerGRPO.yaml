# ============================================================================
# TrainerGRPO Configuration File
# ============================================================================
# Simplified configuration for Unsloth-based training with GRPO

grpo:
  max_seq_length: 24576
  mask_non_assistant_tokens: true
  discard_long_conversations: true # false will truncate the conversation to the max_seq_length
  clip_ratio_epsilon_lower: 0.2
  clip_ratio_epsilon_upper: 0.28
  gspo_clip_ratio_epsilon_lower: 0.008  # default: 3e-4
  gspo_clip_ratio_epsilon_upper: 0.016  # default: 4e-4
  clip_gradient_scale: 0.0  # The scale applied to the gradient when it is outside of the range [epsilon_lower, epsilon_upper]. 0.0 means max clipping and no gradient outside the range.
  bound_advantage_range: 5.0
  beta: 0.0  # KL divergence coefficient
  loss_type: gspo
  gamma: 0.5
  use_truncated_is: false
  truncated_is_ratio: 2.0
  use_entropy_shaping: true
  entropy_shaping_alpha: 1.0
  entropy_shaping_kappa: 2.0
  pkpo_advantages_k: 1
  correctness_reward: 0.1
  speedup_reward: 0.3
  improvement_bonus: 0.1

# ============================================================================
# TRAINING CONFIGURATION
# ============================================================================
training:
  # Basic training parameters
  micro_batch_size: 1
  loss_multiplier: 1.0
