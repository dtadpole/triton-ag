# built in queues
queues:
  - name: trainer.sft.1
  - name: trainer.rft.1
  - name: trainer.grpo.1
  - name: test.test.1

global:
  prefix_tag: "TC_0.1.0_14B.m"
  start_epoch: 0
  start_block: 0
  end_epoch: 20
  end_block: 24

  init_vars:
    - name: adapter.model_override.{model_tag}
      value: null

workitems:
  codeGenEval.init:
    # below syntax works with ConfigInterpreter
    steps:
      - type: endpoint
        endpoint: workflowClient.enqueue
        context_vars:
          item:
            type: inference
            name: codeGenEval.base
            prefix_tag: "`prefix_tag`"
            epoch_id: "`epoch_id`"
            block_id: "`block_id`"
            provider_name: local
            model_name: qwen3-14b
            num_samples: 8
            num_generations: 8
            num_turns_per_generation: 4
            parallel_workers: 12
            logprobs: true
            model_override: null
            template: triton.1
            input_dir: ~/triton-ag/kernel_bench
            output_dir: ~/.inference/codeGenEval
        args:
          prefix_tag: "`prefix_tag`"
          queue_name: "inference.codeGenEval"
          item: "`item`"
          create_queue: true
      - type: endpoint
        endpoint: workflowClient.qsize
        args:
          prefix_tag: "`prefix_tag`"
          queue_name: "inference.codeGenEval"
        returns:
          context_vars:
            qsize: "`__result__`"
          wait_for:
            condition: "`qsize < 8`"
            interval: 15
            timeout: 3600

inference.composer:
  codeGenEval.base:
    default:
      input_dir: ~/.inference/composer/input
      output_dir: ~/.inference/composer/output
      module_file: inference/codeGen.module.yaml
      prompt_file: inference/codeGen.prompt.triton.yaml
      example_file: inference/triton.example.yaml
      provider_name: local
      model_name: qwen3-14b
      num_generations: 8
      num_turns_per_generation: 4
      parallel_workers: 32
      logprobs: true
      input_tag: kernel_bench
      model_override: null

    post_workitems:
      # the below syntax works with ConfigInterpreter
      steps:
        - type: endpoint
          endpoint: workflowClient.enqueue
          args:
            prefix_tag: "{prefix_tag}"
            queue_name: "trainer.grpo:grpo.1"
            item:
              prefix_tag: "{prefix_tag}"
              epoch_id: "{epoch_id}"
              block_id: "{block_id}"
              input_tag: "{run_tag}"
              input_dir: ~/.codeGenEval
            create_queue: true
        - type: endpoint
          endpoint: workflowClient.enqueue
          args:
            prefix_tag: "{prefix_tag}"
            queue_name: "trainer.grpo:grpo.1"
            item:
              prefix_tag: "{prefix_tag}"
              epoch_id: "{epoch_id}"
              block_id: "{block_id}"
              input_tag: "{run_tag}"
              input_dir: ~/.codeGenEval
            create_queue: true

  exemplar.deepseek-v3:
    default:
      input_dir: ~/.inference/composer/input
      output_dir: ~/.inference/composer/output
      module_file: inference/exemplar.module.yaml
      prompt_file: inference/codeGen.prompt.triton.yaml
      example_file: inference/triton.example.yaml
      provider_name: fireworks
      model_name: deepseek-v3
      num_samples: 8 # this is not used, but required by the module
      num_generations: 4 # this is not used, but required by the module
      parallel_workers: 8
      logprobs: false
      template: triton.1
      model_override: null

    post_workitems:
      - type: trainer.sft
        name: sft.1
        prefix_tag: "{prefix_tag}"
        epoch_id: "{epoch_id}"
        block_id: "{block_id}"
        input_tag: "{run_tag}"
        input_dir: ~/.inference/exemplar.deepseek-v3

  exemplar.kimi-k2:
    default:
      input_dir: ~/.inference/composer/input
      output_dir: ~/.inference/composer/output
      module_file: inference/exemplar.module.yaml
      prompt_file: inference/codeGen.prompt.triton.yaml
      example_file: inference/triton.example.yaml
      provider_name: fireworks
      model_name: kimi-k2
      num_samples: 8 # this is not used, but required by the module
      num_generations: 4 # this is not used, but required by the module
      parallel_workers: 8
      logprobs: false
      template: triton.1
      model_override: null

    post_workitems:
      - type: trainer.sft
        name: sft.1
        prefix_tag: "{prefix_tag}"
        epoch_id: "{epoch_id}"
        block_id: "{block_id}"
        input_tag: "{run_tag}"
        input_dir: ~/.inference/exemplar.kimi-k2

trainer.sft:
  sft.1:
    default:
      output_dir: ~/.trainer

trainer.rft:
  rft.1:
    default:
      output_dir: ~/.trainer

trainer.grpo:
  grpo.1:
    default:
      output_dir: ~/.trainer
