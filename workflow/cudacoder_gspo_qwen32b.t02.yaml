# built in queues
queues:
  - name: trainer.sft.1
  - name: trainer.rft.1
  - name: trainer.grpo.1
  - name: sync.sync.1
  - name: test.test.1

# global variables
global:
  prefix_tag: "cudacoder_gspo_qwen32b.t02"
  start_epoch: 0
  start_block: 0
  end_epoch: 1
  end_block: 8

init:
  codeGenEval.base:
    - queue_type: inference
      queue_name: codeGenEval.base
      prefix_tag: "{prefix_tag}"
      epoch_id: "{epoch_id}"
      block_id: "{block_id}"
      input_tag: "{input_tag}"
      num_samples: 16
      num_generations: 8
      num_turns_per_generation: 4
      parallel_workers: 48
      model_name: qwen3-32b
      vllm_providers: ["h100_8_5_a"]
      logp_providers: ["h100_8_5_b"]
      kbeval_providers: ["h8_1"]
      module_file: inference/codeGenEval.module.vllm+logp.yaml
      prompt_file: inference/cuda.prompt.yaml
      example_file: inference/cuda.example.yaml
      input_dir: /workspace/kernel_bench/level1
      output_dir: shared/.inference/codeGenEval
    # - queue_type: inference
    #   queue_name: codeGenEval.base
    #   prefix_tag: "{prefix_tag}"
    #   epoch_id: "{epoch_id}"
    #   block_id: "{block_id}"
    #   input_tag: "{input_tag}"
    #   num_samples: 16
    #   num_generations: 8
    #   num_turns_per_generation: 4
    #   parallel_workers: 48
    #   model_name: qwen3-32b
    #   vllm_providers: ["h100_8_5_a", "h100_8_5_b"]
    #   logp_providers: ["a100_4_2_a", "a100_4_2_b"]
    #   kbeval_providers: ["h8_1"]
    #   module_file: inference/codeGenEval.module.vllm+logp.yaml
    #   prompt_file: inference/cuda.prompt.yaml
    #   example_file: inference/cuda.example.yaml
    #   input_dir: /workspace/kernel_bench/level2
    #   output_dir: shared/.inference/codeGenEval

inference:
  codeGenEval.base:
    default:
      module_file: inference/codeGenEval.module.vllm+logp.yaml
      prompt_file: inference/cuda.prompt.yaml
      example_file: inference/cuda.example.yaml
      input_dir: /workspace/kernel_bench/level1
      output_dir: shared/.inference/codeGenEval
      vllm_providers: ["local"]
      logp_providers: ["local"]
      kbeval_providers: ["local"]
      model_name: qwen3-14b
      num_generations: 8
      num_turns_per_generation: 4
      parallel_workers: 32
      logprobs: true
      input_tag: kernel_bench
      custom_provider: local
      model_override: null

    callbacks:
      completion:
        - queue_type: trainer
          queue_name: grpo.1
          prefix_tag: "{prefix_tag}"
          epoch_id: "{epoch_id}"
          block_id: "{block_id}"
          input_tag: "{run_tag}"
          input_dir: shared/.inference/codeGenEval
          output_dir: shared/.trainer
        # - queue_type: trainer
        #   queue_name: rft.1
        #   prefix_tag: "{prefix_tag}"
        #   epoch_id: "{epoch_id}"
        #   block_id: "{block_id}"
        #   input_tag: "{run_tag}"
        #   input_dir: ~/.inference/codeGenEval

trainer:
  grpo.1:
    default:
      output_dir: shared/.trainer

    callbacks:
      checkpoint:
        - queue_type: sync
          queue_name: sync.1
          prefix_tag: "{prefix_tag}"
          epoch_id: "{epoch_id}"
          block_id: "{block_id}"
          input_tag: "{run_tag}"
          module_file: workflow/sync.module.vllm+logp_norsync.yaml
          context:
            checkpoint_name: "{env[checkpoint_name]}"
            vllm_providers: ["h100_8_5_a"]
            logp_providers: ["h100_8_5_b"]
            sync_hosts: []
            # sync_hosts: ["devvm8490.cco0.facebook.com"]

sync:
  sync.1:
    default:
      module_file: workflow/sync.module.vllm+logp_norsync.yaml # this will require both vllm_provider and logp_provider

    callbacks:
      codeGenEval.base:
      - queue_type: inference
        queue_name: codeGenEval.base
        prefix_tag: "{prefix_tag}"
        epoch_id: "{epoch_id+1}"
        block_id: "{block_id}"
        input_tag: "{input_tag}"
        num_samples: 16
        num_generations: 8
        num_turns_per_generation: 4
        parallel_workers: 48
        model_name: qwen3-32b
        vllm_providers: ["h100_8_5_a"]
        logp_providers: ["h100_8_5_b"]
        kbeval_providers: ["h8_1"]
        module_file: inference/codeGenEval.module.vllm+logp.yaml
        prompt_file: inference/cuda.prompt.yaml
        example_file: inference/cuda.example.yaml
        input_dir: /workspace/kernel_bench/level1
        output_dir: shared/.inference/codeGenEval
