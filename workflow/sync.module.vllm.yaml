sync_task:
  # required context variables:
  # - prefix_tag
  # - checkpoint_name
  # - vllm_provider
  # - vllm_host
  steps:
    - type: command
      commands:
        - |
          rsync -azP --rsync-path 'mkdir -p .trainer/{checkpoint_name} && rsync' \
              ~/.trainer/{checkpoint_name}/adapter_config.json \
              {vllm_host}:.trainer/{checkpoint_name}/
        - |
          rsync -azP --rsync-path 'mkdir -p .trainer/{checkpoint_name} && rsync' \
              ~/.trainer/{checkpoint_name}/adapter_model.safetensors \
              {vllm_host}:.trainer/{checkpoint_name}/
    # load the lora adapter
    - type: code
      code_snippet_path: 'workflow/sync.vllm.lora.py'
      code_snippet_block: |
        __async__ = load_lora_adapters(vllm_provider, checkpoint_name)
      async: true
      returns:
        logging:
          info: "Loaded adapter: {checkpoint_name}"
    # get unused lora adapters
    - type: code
      code_snippet_path: 'workflow/sync.vllm.unused.py'
      code_snippet_block: |
        # get unused lora adapters
        __async__ = get_unused_lora_adapters(
            prefix_tag=prefix_tag,
            vllm_provider=vllm_provider,
            recent_checkpoint_name=checkpoint_name,
        )
      async: true
      returns:
        logging:
          info: "Unused adapters: {__result__}"
    - type: iterator
      collection: "`__result__`"
      steps:
        # for each unused lora adapter, unload it
        - type: code
          code_snippet_path: 'workflow/sync.vllm.lora.py'
          code_snippet_block: |
            __async__ = unload_lora_adapters(vllm_provider, __item__)
          async: true
          returns:
            logging:
              info: "Unloaded LoRA adapter: {__item__}"

enqueue_task:
  steps:
    - type: endpoint
      endpoint: workflowClient.enqueue
      input:
        - queue_name: "`queue_name`"
        - item:
          - checkpoint_name: "`checkpoint_name`"
            server_hostname: "`vllm_provider`"
        - create_queue: true
      returns:
        logging:
          method: "log_enqueue"
