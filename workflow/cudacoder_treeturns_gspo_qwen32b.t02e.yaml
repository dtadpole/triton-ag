# built in queues
queues:
  - name: trainer.sft.1
  - name: trainer.rft.1
  - name: trainer.uft.1
  - name: trainer.grpo.1
  - name: sync.sync.1
  - name: test.test.1

# global variables
global:
  prefix_tag: "cudacoder_treeturns_gspo_qwen32b.t02e"
  start_epoch: 0
  start_block: 0
  end_epoch: 20
  end_block: 50
  hint_length_prob_start: 0.0
  hint_length_prob_end: 0.0

init:
  codeGenEval.base:
    - queue_type: inference
      queue_name: codeGenEval.base
      prefix_tag: "{prefix_tag}"
      epoch_id: "{epoch_id}"
      block_id: "{block_id}"
      input_tag: "{input_tag}"
      num_samples: 8
      num_generations: 8
      num_turns_per_generation: 4
      min_num_generations: 5
      selection_strategy: "best_speedup"
      parallel_workers: 32
      model_name: qwen3-32b
      vllm_providers: ["h100_8_5_a"]
      logp_providers: ["h100_8_5_b", "h100_8_5_c"]
      kbeval_providers: ["h8_4", "h8_2"]
      module_file: inference/codeGenEval.module.treeturns.vllm+logp.yaml
      prompt_file: inference/cuda.prompt.yaml
      example_file: inference/cuda.example.yaml
      input_dir: /workspace/kernel_bench/level?
      output_dir: shared/.inference/codeGenEval

inference:
  codeGenEval.base:
    default:
      module_file: inference/codeGenEval.module.treeturns.vllm+logp.yaml
      prompt_file: inference/cuda.prompt.yaml
      example_file: inference/cuda.example.yaml
      input_dir: /workspace/kernel_bench/level?
      output_dir: shared/.inference/codeGenEval
      vllm_providers: ["local"]
      logp_providers: ["local"]
      kbeval_providers: ["local"]
      model_name: qwen3-14b
      num_generations: 8
      num_turns_per_generation: 4
      parallel_workers: 32
      logprobs: true
      input_tag: kernel_bench
      custom_provider: local
      model_override: null

    callbacks:
      completion:
        - queue_type: trainer
          queue_name: grpo.1
          prefix_tag: "{prefix_tag}"
          epoch_id: "{epoch_id}"
          block_id: "{block_id}"
          input_tag: "{run_tag}"
          input_dir: shared/.inference/codeGenEval
          output_dir: shared/.trainer
        # - queue_type: trainer
        #   queue_name: rft.1
        #   prefix_tag: "{prefix_tag}"
        #   epoch_id: "{epoch_id}"
        #   block_id: "{block_id}"
        #   input_tag: "{run_tag}"
        #   input_dir: ~/.inference/codeGenEval

trainer:
  grpo.1:
    default:
      output_dir: shared/.trainer

    callbacks:
      checkpoint:
        - queue_type: sync
          queue_name: sync.1
          prefix_tag: "{prefix_tag}"
          epoch_id: "{epoch_id}"
          block_id: "{block_id}"
          input_tag: "{run_tag}"
          module_file: workflow/sync.module.vllm+logp_norsync.yaml
          context:
            checkpoint_name: "{env[checkpoint_name]}"
            vllm_providers: ["h100_8_5_a"]
            logp_providers: ["h100_8_5_b", "h100_8_5_c"]
            sync_hosts: []
            # sync_hosts: ["devvm8490.cco0.facebook.com"]

sync:
  sync.1:
    default:
      module_file: workflow/sync.module.vllm+logp_norsync.yaml # this will require both vllm_provider and logp_provider
