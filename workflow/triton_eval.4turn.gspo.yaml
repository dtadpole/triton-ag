# built in queues
queues:
  - name: trainer.sft.1
  - name: trainer.rft.1
  - name: trainer.grpo.1
  - name: rsync.rsync.1
  - name: test.test.1

global:
  prefix_tag: "triton_eval.4turn.gspo"
  start_epoch: 0
  start_block: 0
  end_epoch: 1
  end_block: 8

init:
  codeGenEval.base:
    # - queue_type: inference
    #   queue_name: codeGenEval.base
    #   prefix_tag: "{prefix_tag}"
    #   epoch_id: "{epoch_id}"
    #   block_id: "{block_id}"
    #   input_tag: "{input_tag}"
    #   num_samples: 25
    #   num_generations: 8
    #   num_turns_per_generation: 4
    #   parallel_workers: 32
    #   model_name: triton_treeturns_gspo_qwen32b.t01/checkpoint-6300
    #   vllm_providers: ["h100_8_5_a"]
    #   logp_providers: ["a4_1"]
    #   kbeval_providers: ["a4_1", "a4_2", "a4_3"]
    #   module_file: inference/codeGenFullEval.module.chat.yaml
    #   prompt_file: inference/triton.prompt.yaml
    #   example_file: inference/triton.example.yaml
    #   input_dir: /workspace/kernel_bench/level[1-2]
    #   output_dir: shared/.inference/codeGenEval
    - queue_type: inference
      queue_name: codeGenEval.base
      prefix_tag: "{prefix_tag}"
      epoch_id: "{epoch_id}"
      block_id: "{block_id}"
      input_tag: "{input_tag}"
      num_samples: 25
      num_generations: 8
      num_turns_per_generation: 4
      parallel_workers: 32
      model_name: adamo1139/DeepSeek-R1-0528-AWQ
      vllm_providers: ["h100_8_5_a"]
      logp_providers: ["a4_1"]
      kbeval_providers: ["a4_1", "a4_2", "a4_3"]
      module_file: inference/codeGenFullEval.module.chat.yaml
      prompt_file: inference/triton.prompt.yaml
      example_file: inference/triton.example.yaml
      input_dir: /workspace/kernel_bench/level[1-2]
      output_dir: shared/.inference/codeGenEval
inference:
  codeGenEval.base:
    default:
      input_dir: shared/.inference/composer/input
      output_dir: shared/.inference/composer/output
      module_file: inference/codeGenFullEval.module.chat.yaml
      prompt_file: inference/cuda.prompt.yaml
      example_file: inference/cuda.example.yaml
      provider_name: h100_8b
      model_name: gpt-oss-120b
      num_generations: 8
      num_turns_per_generation: 4
      parallel_workers: 32
      logprobs: true
      input_tag: kernel_bench
      model_override: null
