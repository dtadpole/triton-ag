
global:
  prefix_tag: "TC_0.1.0_14B.g"
  num_epochs: 20
  num_blocks_per_epoch: 24

  init_vars:
    adapter.codeGenEval.model_override: null

  init_tasks:
    codeGenEval.1:
      type: inference.codeGenEval
      prefix_tag: "{prefix_tag}"
      epoch_id: "{epoch_id}"
      block_id: "{block_id}"
      provider_name: local
      model_name: qwen3-14b
      num_samples: 8
      num_generations: 8
      parallel_tasks: 32
      logprobs: true
      model_override: null
      template: triton.1
      input_dir: ~/triton-ag/kernel_bench
      output_dir: ~/.codeGenEval

inference.codeGenEval:
  default:
    input_dir: ~/triton-ag/kernel_bench
    output_dir: ~/.codeGenEval

  post_tasks:
    exemplar.1:
      type: inference.exemplar
      prefix_tag: "{prefix_tag}"
      epoch_id: "{epoch_id}"
      block_id: "{block_id}"
      input_tag: "{run_tag}"
      provider_name: fireworks
      model_name: deepseek-v3
      num_generations: 4
      parallel_tasks: 24
      template: triton.1
      input_dir: ~/.codeGenEval
    grpo.1:
      type: trainer.grpo
      prefix_tag: "{prefix_tag}"
      epoch_id: "{epoch_id}"
      block_id: "{block_id}"
      input_tag: "{run_tag}"
      input_dir: ~/.codeGenEval
    rft.1:
      type: trainer.rft
      prefix_tag: "{prefix_tag}"
      epoch_id: "{epoch_id}"
      block_id: "{block_id}"
      input_tag: "{run_tag}"
      input_dir: ~/.codeGenEval

inference.exemplar:
  default:
    provider_name: fireworks
    model_name: deepseek-v3
    input_dir: ~/.codeGenEval
    output_dir: ~/.exemplar

  post_tasks:
    sft.1:
      type: trainer.sft
      prefix_tag: "{prefix_tag}"
      epoch_id: "{epoch_id}"
      block_id: "{block_id}"
      input_tag: "{run_tag}"
      input_dir: ~/.exemplar

inference.critique:
  default:
    provider_name: fireworks
    model_name: deepseek-v3
    input_dir: ~/.codeGenEval
    output_dir: ~/.critique

  post_tasks:
    sft.1:
      type: trainer.sft
      prefix_tag: "{prefix_tag}"
      epoch_id: "{epoch_id}"
      block_id: "{block_id}"
      input_tag: "{run_tag}"
      input_dir: ~/.codeGenEval
      output_dir: ~/.trainer

trainer.sft:
  default:
    output_dir: ~/.trainer

trainer.rft:
  default:
    output_dir: ~/.trainer

trainer.grpo:
  default:
    output_dir: ~/.trainer
