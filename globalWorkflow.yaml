
global:
  prefix_tag: "TC_0.1.0_14B.h"
  num_epochs: 20
  num_blocks_per_epoch: 24

  init_vars:
    - name: adapter.model_override
      value: null

  init_tasks:
    - type: inference.composer
      name: codeGenEval.1
      prefix_tag: "{prefix_tag}"
      epoch_id: "{epoch_id}"
      block_id: "{block_id}"
      provider_name: local
      model_name: qwen3-14b
      num_samples: 8
      num_generations: 8
      num_turns_per_generation: 4
      parallel_tasks: 32
      logprobs: true
      model_override: null
      template: triton.1
      input_dir: ~/triton-ag/kernel_bench
      output_dir: ~/.codeGenEval

inference.composer:
  codeGenEval.1:
    default:
      input_dir: ~/.inference/composer/input
      output_dir: ~/.inference/composer/output
      module_file: inferenceComposer/codeGen.module.yaml
      prompt_file: inferenceComposer/codeGen.prompt.triton.yaml
      example_file: inferenceComposer/triton.example.yaml
      provider_name: local
      model_name: qwen3-14b
      num_generations: 8
      num_turns_per_generation: 4
      parallel_tasks: 32
      logprobs: true
      input_tag: kernel_bench
      model_override: null

    post_tasks:
      # - type: inference.exemplar
      #   name: exemplar.1
      #   prefix_tag: "{prefix_tag}"
      #   epoch_id: "{epoch_id}"
      #   block_id: "{block_id}"
      #   input_tag: "{run_tag}"
      #   provider_name: fireworks
      #   model_name: deepseek-v3
      #   num_generations: 2
      #   parallel_tasks: 24
      #   template: triton.1
      #   input_dir: ~/.codeGenEval
      - type: trainer.grpo
        name: grpo.1
        prefix_tag: "{prefix_tag}"
        epoch_id: "{epoch_id}"
        block_id: "{block_id}"
        input_tag: "{run_tag}"
        input_dir: ~/.codeGenEval
      - type: trainer.rft
        name: rft.1
        prefix_tag: "{prefix_tag}"
        epoch_id: "{epoch_id}"
        block_id: "{block_id}"
        input_tag: "{run_tag}"
        input_dir: ~/.codeGenEval

trainer.sft:
  sft.1:
    default:
      output_dir: ~/.trainer

trainer.rft:
  rft.1:
    default:
      output_dir: ~/.trainer

trainer.grpo:
  grpo.1:
    default:
      output_dir: ~/.trainer
