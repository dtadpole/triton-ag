
global:
  num_epochs: 100
  num_blocks_per_epoch: 16

  init_vars:
    inference.codeGenEval.model_override: null

  init_tasks:
    codeGenEval:
      prefix_tag: "{prefix_tag}"
      epoch_id: "{epoch_id}"
      block_id: "{block_id}"
      provider_name: local
      model_name: qwen3-14b
      num_samples: 12
      num_generations: 16
      parallel_tasks: 24
      logprobs: true
      model_override: null
      input_dir: ~/triton-ag/kernel_bench
      output_dir: ~/.codeGenEval

codeGenEval:
  default:
    input_dir: ~/triton-ag/kernel_bench
    output_dir: ~/.codeGenEval

  post_tasks:
    critique:
      prefix_tag: "{prefix_tag}"
      epoch_id: "{epoch_id}"
      block_id: "{block_id}"
      input_tag: "{run_tag}"
      provider_name: fireworks
      model_name: deepseek-v3
      input_dir: ~/.codeGenEval
      output_dir: ~/.critique
    trainerGRPO:
      prefix_tag: "{prefix_tag}"
      epoch_id: "{epoch_id}"
      block_id: "{block_id}"
      input_tag: "{run_tag}"
      input_dir: ~/.codeGenEval
      output_dir: ~/.trainer

critique:
  default:
    provider_name: fireworks
    model_name: deepseek-v3
    input_dir: ~/.codeGenEval
    output_dir: ~/.critique

  post_tasks:
    trainerSFT:
      prefix_tag: "{prefix_tag}"
      epoch_id: "{epoch_id}"
      block_id: "{block_id}"
      input_tag: "{run_tag}"
      input_dir: ~/.codeGenEval
      output_dir: ~/.trainer

