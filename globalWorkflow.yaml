
global:
  prefix_tag: "TC_0.1.0_14B.m"
  start_epoch: 0
  start_block: 0
  end_epoch: 20
  end_block: 24

  init_vars:
    - name: adapter.model_override
      value: null

  init_tasks:
    - type: inference.composer
      name: codeGenEval.base
      prefix_tag: "{prefix_tag}"
      epoch_id: "{epoch_id}"
      block_id: "{block_id}"
      provider_name: local
      model_name: qwen3-14b
      num_samples: 8
      num_generations: 8
      num_turns_per_generation: 4
      parallel_workers: 12
      logprobs: true
      model_override: null
      template: triton.1
      input_dir: ~/triton-ag/kernel_bench
      output_dir: ~/.codeGenEval

inference.composer:
  codeGenEval.base:
    default:
      input_dir: ~/.inference/composer/input
      output_dir: ~/.inference/composer/output
      module_file: inferenceComposer/codeGen.module.yaml
      prompt_file: inferenceComposer/codeGen.prompt.triton.yaml
      example_file: inferenceComposer/triton.example.yaml
      provider_name: local
      model_name: qwen3-14b
      num_generations: 8
      num_turns_per_generation: 4
      parallel_workers: 32
      logprobs: true
      input_tag: kernel_bench
      model_override: null

    post_tasks:
      - type: trainer.grpo
        name: grpo.1
        prefix_tag: "{prefix_tag}"
        epoch_id: "{epoch_id}"
        block_id: "{block_id}"
        input_tag: "{run_tag}"
        input_dir: ~/.codeGenEval
      - type: trainer.rft
        name: rft.1
        prefix_tag: "{prefix_tag}"
        epoch_id: "{epoch_id}"
        block_id: "{block_id}"
        input_tag: "{run_tag}"
        input_dir: ~/.codeGenEval
      # - type: inference.composer
      #   name: exemplar.deepseek-v3
      #   prefix_tag: "{prefix_tag}"
      #   epoch_id: "{epoch_id}"
      #   block_id: "{block_id}"
      #   input_tag: "{run_tag}"
      #   parallel_workers: 8
      #   input_dir: ~/.codeGenEval
      #   output_dir: ~/.inference/exemplar.deepseek-v3
      # - type: inference.composer
      #   name: exemplar.kimi-k2
      #   prefix_tag: "{prefix_tag}"
      #   epoch_id: "{epoch_id}"
      #   block_id: "{block_id}"
      #   input_tag: "{run_tag}"
      #   parallel_workers: 2
      #   input_dir: ~/.codeGenEval
      #   output_dir: ~/.inference/exemplar.kimi-k2

  exemplar.deepseek-v3:
    default:
      input_dir: ~/.inference/composer/input
      output_dir: ~/.inference/composer/output
      module_file: inferenceComposer/exemplar.module.yaml
      prompt_file: inferenceComposer/codeGen.prompt.triton.yaml
      example_file: inferenceComposer/triton.example.yaml
      provider_name: fireworks
      model_name: deepseek-v3
      num_samples: 8 # this is not used, but required by the module
      num_generations: 4 # this is not used, but required by the module
      parallel_workers: 8
      logprobs: false
      template: triton.1
      model_override: null

    post_tasks:
      - type: trainer.sft
        name: sft.1
        prefix_tag: "{prefix_tag}"
        epoch_id: "{epoch_id}"
        block_id: "{block_id}"
        input_tag: "{run_tag}"
        input_dir: ~/.inference/exemplar.deepseek-v3

  exemplar.kimi-k2:
    default:
      input_dir: ~/.inference/composer/input
      output_dir: ~/.inference/composer/output
      module_file: inferenceComposer/exemplar.module.yaml
      prompt_file: inferenceComposer/codeGen.prompt.triton.yaml
      example_file: inferenceComposer/triton.example.yaml
      provider_name: fireworks
      model_name: kimi-k2
      num_samples: 8 # this is not used, but required by the module
      num_generations: 4 # this is not used, but required by the module
      parallel_workers: 8
      logprobs: false
      template: triton.1
      model_override: null

    post_tasks:
      - type: trainer.sft
        name: sft.1
        prefix_tag: "{prefix_tag}"
        epoch_id: "{epoch_id}"
        block_id: "{block_id}"
        input_tag: "{run_tag}"
        input_dir: ~/.inference/exemplar.kimi-k2

trainer.sft:
  sft.1:
    default:
      output_dir: ~/.trainer

trainer.rft:
  rft.1:
    default:
      output_dir: ~/.trainer

trainer.grpo:
  grpo.1:
    default:
      output_dir: ~/.trainer
